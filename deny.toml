# cargo-deny configuration. Run with `cargo deny check`.

[graph]
all-features = true

[licenses]
# Everything we link must be redistributable under `MIT OR Apache-2.0`.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
# `openssl` (and its sys crate) and `ring` do not build for the ARMv7 / glibc 2.24 target.
deny = [{ name = "openssl" }, { name = "openssl-sys" }, { name = "ring" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
