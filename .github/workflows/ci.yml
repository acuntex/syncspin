# Continuous integration for the syncspin workspace.
#
# The job names `lint`, `test`, `msrv`, `arm`, `deny`, `docs` and `secrets` are
# the gates branch protection refers to; renaming one silently drops it from the
# required set, so keep the names stable.
#
# Actions are pinned by commit SHA with the version in a trailing comment, which is
# what Renovate's `helpers:pinGitHubActionDigests` preset (see `renovate.json5`)
# maintains. A version tag is mutable; a SHA is not.
#
# Runners are pinned by label, not `ubuntu-latest`: an image promotion must not
# change a job's toolchain without a commit. Renovate bumps the label.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Mutation testing is slow (every mutant runs the suite), so it runs weekly instead of
  # per push. A red run means a test no longer notices a deliberate code change.
  schedule:
    - cron: "0 4 * * 1"

# The repository is public and no job needs a secret, so every job gets the
# read-only default: no token can write, comment or publish.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  # A pull request is worth abandoning when a newer commit arrives; a push to
  # `main` is not, because every commit on the default branch must be built.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: example manifests
        run: scripts/check-example-versions.sh

  test:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo test
        run: cargo test --workspace --locked
      # Feature unification matters here. `syncspin-client` has no default
      # features, but `player-pipe` enables `storage-file` by default, so the
      # workspace run above turns it on for the client and runs the file
      # backend's tests. `pairing-code` is off everywhere unless requested.
      # The second run adds the code flows; the third tests the library crates
      # with their own defaults, which is what a consumer that enables nothing
      # gets. All three are the `test` gate.
      - name: cargo test (pairing features)
        run: cargo test --workspace --features pairing-code,storage-file --locked
      - name: cargo test (library defaults)
        run: cargo test -p syncspin-core -p syncspin-client --locked
      # The mDNS flow of `mdns-pair` is behind its own feature, so none of the runs
      # above builds or tests it. The tests need no multicast socket.
      - name: cargo test (mdns-pair flow)
        run: cargo test -p mdns-pair --features mdns --locked

  msrv:
    name: msrv
    runs-on: ubuntu-26.04
    # `rust-toolchain.toml` pins `stable` and wins over a job-level toolchain
    # selection, so this job must override the file explicitly. Without
    # `RUSTUP_TOOLCHAIN` the MSRV gate would silently test the current stable
    # (1.95) and pass while 1.85 is broken.
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: toolchain in use
        run: |
          rustc --version
          cargo --version
      - name: cargo test (MSRV)
        run: cargo test --workspace --locked
      # The pairing crates pull `elligator2`, `chacha20poly1305` and `hmac`, all
      # optional. Without this step a dependency bump could raise their MSRV and
      # the gate would stay green while 1.85 consumers cannot build.
      - name: cargo test with every feature (MSRV)
        run: cargo test --workspace --features pairing-code,storage-file --locked

  arm:
    name: arm
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: rustup target add armv7
        run: rustup target add armv7-unknown-linux-gnueabihf
      # Compile guard, not a release build. `--all-features` is what makes it
      # meaningful now: the pairing code flows pull in `elligator2`,
      # `chacha20poly1305`, `sha2` and `hmac`, and none of them would be
      # cross-compiled with the default set. Once a crate links a real
      # dependency or the `wss` feature lands this must become
      # `cargo zigbuild --target armv7-unknown-linux-gnueabihf` (installing
      # `cargo-zigbuild` and a `zig` binary) so the glibc 2.24 baseline is
      # actually exercised.
      # The server is a published crate from 0.2 on, so it belongs in the guard:
      # an ARM-only consumer must be able to build a server too.
      - name: cargo check (armv7)
        run: cargo check -p syncspin-core -p syncspin-client -p syncspin-server --all-features --target armv7-unknown-linux-gnueabihf --locked

  coverage:
    runs-on: ubuntu-26.04
    # One definition for both steps below: the gate and the summary must not drift.
    env:
      COVERAGE_FLOOR: "91.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Prebuilt binary, as in `mutants` below. With a warm `rust-cache` this costs
      # about a second either way, because the cache carries `~/.cargo/bin`; the
      # difference is a cache miss, where `cargo install --locked` compiles the tool
      # and this downloads it.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage floor
        # `--all-features` is deliberate: on default features the run never sees
        # `pairing/pake.rs`, `wrap.rs` or `code.rs`, so most of the new crypto had
        # no coverage number at all.
        #
        # The floor follows the workspace, and the workspace changed: core and the
        # client sit around 96.7, the server crate that arrived in 0.2 sits near 85.
        # 91.0 against a measured 91.08 keeps a real regression visible without
        # asserting a number the new crate has not earned yet. Raising the server's
        # suites raises this floor; it is a target, not a trophy.
        # This job is not a required check: a percentage gate that pages on a
        # refactor teaches people to lower the floor. It reports; it does not block.
        run: |
          cargo llvm-cov --workspace --all-features --locked --ignore-filename-regex 'examples/' \
            --lcov --output-path lcov.info --fail-under-lines "${COVERAGE_FLOOR}"
      - name: Coverage summary
        # Without this the percentage lives only in the log of a job nobody opens.
        # `always()` reports it even when the floor just failed, and
        # `continue-on-error` keeps this step out of the verdict: a run that died before
        # measuring has already failed above, and the summary must not mask that with a
        # second, more confusing error.
        if: always()
        continue-on-error: true
        run: |
          # The regex must match the step above, or the summary describes a different
          # denominator than the gate.
          cargo llvm-cov report --json --summary-only --ignore-filename-regex 'examples/' \
            --output-path coverage.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os

          totals = json.load(open("coverage.json"))["data"][0]["totals"]
          floor = os.environ["COVERAGE_FLOOR"]
          print("### Coverage (all features, examples ignored)\n")
          print("| Metric | Covered | Total | Percent |")
          print("| --- | --- | --- | --- |")
          rows = (("Lines", "lines"), ("Functions", "functions"), ("Regions", "regions"))
          for label, key in rows:
              t = totals[key]
              print(f"| {label} | {t['covered']} | {t['count']} | {t['percent']:.2f}% |")
          print(f"\nLines floor {floor}%, advisory - this job is not a required check.")
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

  mutants:
    # Every pull request, the weekly schedule and a manual dispatch: one full test run per
    # mutant. `syncspin-core` first - it holds the protocol and crypto code where a silent
    # behaviour change would be worst.
    #
    # Running on every PR costs the four shards below a few minutes each, in parallel; a PR
    # therefore pays roughly one extra job's wall-clock for a check the weekly run would only
    # report days later. Every PR includes a core change's blast radius, so the run is not
    # conditional on the paths a PR touches.
    #
    # One runner cannot finish this in the timeout below. `syncspin-core` has 553 mutants and
    # each one costs a build plus the suite; the first scheduled run got through a few dozen of
    # them in 22 minutes before the runner shut down. The work is therefore split into four
    # shards of about 140 mutants each, with two mutants built at a time per shard.
    #
    # Every shard must be invoked with identical arguments and the same denominator, or the
    # shards disagree about which mutant belongs to whom and the results are meaningless.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      # A surviving mutant in one shard must not stop the others from finishing: the point of
      # the run is the complete list, not the first red line.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Prebuilt binary instead of `cargo install --locked`: the build cost about a minute per
      # shard and buys nothing, since every shard runs the same published tool.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-mutants
      - name: Mutation testing (core, shard ${{ matrix.shard }}/4)
        # The feature set comes from `.cargo/mutants.toml`, which turns on `pairing-code`: without
        # it `pairing/pake.rs`, `wrap.rs` and `code.rs` are compiled away, their 122 mutants build
        # unchanged, and every one is reported as missed. That file is the single place the flag
        # lives, so a local run and this job test the same crate - passing it here as well makes
        # cargo reject the duplicate and the baseline fails.
        #
        # `--jobs 2` runs two mutants at a time on the four-core runner; the jobserver
        # cargo-mutants starts keeps the concurrent rustc processes within the CPU budget.
        #
        # Two guards, both learned from runs that died. `if len == 0` mutated to `!=` in
        # `pairing/pake.rs::push_len` makes the loop append to a `Vec` forever: with the old
        # 120-second timeout the mutant ate the runner's memory long before the timeout fired, and
        # each "runner has received a shutdown signal" in this job was that mutant. The address
        # space limit kills it on allocation instead. The shorter test timeout bounds the mutants
        # that only spin, like `prepend_len_len`'s `while len >= 0x80` turned into `<`; thirty
        # seconds still leaves room for the 8-second proptest in the suite.
        run: |
          ulimit -v 8000000
          cargo mutants -p syncspin-core --timeout 30 --no-times \
            --shard ${{ matrix.shard }}/4 --jobs 2
      - name: Upload the surviving mutants
        # `always()` and a per-shard name: a shard that is interrupted still has results worth
        # reading, and four shards cannot share one artifact name.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-out-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: ignore

  deny:
    name: deny
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-deny
      # No `-D warnings`: `license-not-encountered` (formerly
      # `unused-allowed-license`) reports every allowed licence that no
      # dependency uses yet, which is every entry of the allowlist at 0.1. That
      # warning is expected until the dependency tree grows; do not turn it into
      # a failure.
      - name: cargo deny
        run: cargo deny check

  package:
    name: package
    runs-on: ubuntu-26.04
    # Publishing is the only moment a broken manifest, a missing README, a licence
    # path or an unused dependency is noticed today. `syncspin-client` and
    # `syncspin-server` cannot be packaged until `syncspin-core` is on crates.io,
    # so only core is checked here; the release workflow packages the other two
    # once core is published.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo package (core)
        run: cargo package -p syncspin-core --locked

  docs:
    name: docs
    runs-on: ubuntu-26.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Both configurations are checked. A consumer that enables no feature must
      # get a warning-free build, so the default run is the one that catches a
      # link to an item behind `pairing-code` or `storage-file`. The
      # `--all-features` run then documents those gated items themselves; the
      # default build leaves them out entirely.
      - name: cargo doc (default features)
        run: cargo doc --workspace --no-deps --locked
      - name: cargo doc (all features)
        run: cargo doc --workspace --no-deps --locked --all-features

  secrets:
    name: secrets
    # Not `if: always()`: a cancelled run should stay cancelled, but a failed
    # sibling job must not hide a leaked-secret finding.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: `gitleaks git` scans every commit, not just the tip.
          fetch-depth: 0
      # gitleaks is not on crates.io and `taiki-e/install-action` has no manifest
      # for it, so the release tarball is the install path. Pinned here; Renovate
      # does not follow release URLs, so bump GITLEAKS_VERSION by hand.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # No token and no `pull_request_target`: the scan reads only the local
      # clone, so it also works on fork pull requests. `--redact` keeps a finding
      # out of the public build log; the exit code still fails the job.
      - name: Scan the full history
        run: gitleaks git --redact --verbose --no-banner

  # `semver` is deliberately absent. `cargo-semver-checks`
  # (`taiki-e/install-action@v2` with `tool: cargo-semver-checks`) needs a
  # published baseline, and no crate has ever been published, so the job would
  # fail on every run. It belongs to the release workflow once `0.1.0` is on
  # crates.io; add it here only if the baseline becomes a git tag.
