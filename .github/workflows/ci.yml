# Continuous integration for the syncspin workspace.
#
# The job names `lint`, `test`, `msrv`, `arm`, `deny`, `docs` and `secrets` are
# the gates branch protection refers to; renaming one silently drops it from the
# required set, so keep the names stable.
#
# Actions are pinned by version tag, not by commit SHA. Renovate's
# `helpers:pinGitHubActionDigests` preset (see `renovate.json5`) rewrites them to
# SHAs on its first run; hand-written SHAs would only be guesses today.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Mutation testing is slow (every mutant runs the suite), so it runs weekly instead of
  # per push. A red run means a test no longer notices a deliberate code change.
  schedule:
    - cron: "0 4 * * 1"

# The repository is public and no job needs a secret, so every job gets the
# read-only default: no token can write, comment or publish.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  # A pull request is worth abandoning when a newer commit arrives; a push to
  # `main` is not, because every commit on the default branch must be built.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --locked
      # Feature unification matters here. `syncspin-client` has no default
      # features, but `player-pipe` enables `storage-file` by default, so the
      # workspace run above turns it on for the client and runs the file
      # backend's tests. `pairing-code` is off everywhere unless requested.
      # The second run adds the code flows; the third tests the library crates
      # with their own defaults, which is what a consumer that enables nothing
      # gets. All three are the `test` gate.
      - name: cargo test (pairing features)
        run: cargo test --workspace --features pairing-code,storage-file --locked
      - name: cargo test (library defaults)
        run: cargo test -p syncspin-core -p syncspin-client --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    # `rust-toolchain.toml` pins `stable` and wins over a job-level toolchain
    # selection, so this job must override the file explicitly. Without
    # `RUSTUP_TOOLCHAIN` the MSRV gate would silently test the current stable
    # (1.95) and pass while 1.85 is broken.
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: toolchain in use
        run: |
          rustc --version
          cargo --version
      - name: cargo test (MSRV)
        run: cargo test --workspace --locked
      # The pairing crates pull `elligator2`, `chacha20poly1305` and `hmac`, all
      # optional. Without this step a dependency bump could raise their MSRV and
      # the gate would stay green while 1.85 consumers cannot build.
      - name: cargo test with every feature (MSRV)
        run: cargo test --workspace --features pairing-code,storage-file --locked

  arm:
    name: arm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rustup target add armv7
        run: rustup target add armv7-unknown-linux-gnueabihf
      # Compile guard, not a release build. `--all-features` is what makes it
      # meaningful now: the pairing code flows pull in `elligator2`,
      # `chacha20poly1305`, `sha2` and `hmac`, and none of them would be
      # cross-compiled with the default set. Once a crate links a real
      # dependency or the `wss` feature lands this must become
      # `cargo zigbuild --target armv7-unknown-linux-gnueabihf` (installing
      # `cargo-zigbuild` and a `zig` binary) so the glibc 2.24 baseline is
      # actually exercised.
      # The server is a published crate from 0.2 on, so it belongs in the guard:
      # an ARM-only consumer must be able to build a server too.
      - name: cargo check (armv7)
        run: cargo check -p syncspin-core -p syncspin-client -p syncspin-server --all-features --target armv7-unknown-linux-gnueabihf --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Coverage floor
        # `--all-features` is deliberate: on default features the run never sees
        # `pairing/pake.rs`, `wrap.rs` or `code.rs`, so most of the new crypto had
        # no coverage number at all.
        #
        # The floor follows the workspace, and the workspace changed: core and the
        # client sit around 96.7, the server crate that arrived in 0.2 sits near 85.
        # 91.0 against a measured 91.08 keeps a real regression visible without
        # asserting a number the new crate has not earned yet. Raising the server's
        # suites raises this floor; it is a target, not a trophy.
        # This job is not a required check: a percentage gate that pages on a
        # refactor teaches people to lower the floor. It reports; it does not block.
        env:
          COVERAGE_FLOOR: "91.0"
        run: |
          cargo llvm-cov --workspace --all-features --locked --ignore-filename-regex 'examples/' \
            --lcov --output-path lcov.info --fail-under-lines "${COVERAGE_FLOOR}"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

  mutants:
    # Weekly only: one full test run per mutant. `syncspin-core` first - it holds the
    # protocol and crypto code where a silent behaviour change would be worst.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Mutation testing (core)
        run: cargo mutants -p syncspin-core --timeout 120 --no-times
      - name: Upload the surviving mutants
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: ignore

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # No `-D warnings`: `license-not-encountered` (formerly
      # `unused-allowed-license`) reports every allowed licence that no
      # dependency uses yet, which is every entry of the allowlist at 0.1. That
      # warning is expected until the dependency tree grows; do not turn it into
      # a failure.
      - name: cargo deny
        run: cargo deny check

  package:
    name: package
    runs-on: ubuntu-latest
    # Publishing is the only moment a broken manifest, a missing README, a licence
    # path or an unused dependency is noticed today. `syncspin-client` and
    # `syncspin-server` cannot be packaged until `syncspin-core` is on crates.io,
    # so only core is checked here; the release workflow packages the other two
    # once core is published.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo package (core)
        run: cargo package -p syncspin-core --locked

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Both configurations are checked. A consumer that enables no feature must
      # get a warning-free build, so the default run is the one that catches a
      # link to an item behind `pairing-code` or `storage-file`. The
      # `--all-features` run then documents those gated items themselves; the
      # default build leaves them out entirely.
      - name: cargo doc (default features)
        run: cargo doc --workspace --no-deps --locked
      - name: cargo doc (all features)
        run: cargo doc --workspace --no-deps --locked --all-features

  secrets:
    name: secrets
    # Not `if: always()`: a cancelled run should stay cancelled, but a failed
    # sibling job must not hide a leaked-secret finding.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: `gitleaks git` scans every commit, not just the tip.
          fetch-depth: 0
      # gitleaks is not on crates.io and `taiki-e/install-action` has no manifest
      # for it, so the release tarball is the install path. Pinned here; Renovate
      # does not follow release URLs, so bump GITLEAKS_VERSION by hand.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # No token and no `pull_request_target`: the scan reads only the local
      # clone, so it also works on fork pull requests. `--redact` keeps a finding
      # out of the public build log; the exit code still fails the job.
      - name: Scan the full history
        run: gitleaks git --redact --verbose --no-banner

  # `semver` is deliberately absent. `cargo-semver-checks`
  # (`taiki-e/install-action@v2` with `tool: cargo-semver-checks`) needs a
  # published baseline, and no crate has ever been published, so the job would
  # fail on every run. It belongs to the release workflow once `0.1.0` is on
  # crates.io; add it here only if the baseline becomes a git tag.
