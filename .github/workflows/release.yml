# Publishing on a tag, so a release is a reproducible pipeline step and not a
# hand-typed sequence on one machine.
#
#   git tag -a vX.Y.Z -m "…" && git push origin vX.Y.Z
#
# The job order is not cosmetic: `syncspin-client` and `syncspin-server` depend
# on `syncspin-core` through the registry, so the index must list core's version
# before either can be packaged. Every step is idempotent — a re-run after a
# partial failure skips what is already published instead of failing on "crate
# version already exists".
#
# Secret: `CARGO_REGISTRY_TOKEN`, a crates.io token scoped to `syncspin-core`,
# `syncspin-client` and `syncspin-server` with `publish-new` and
# `publish-update`. It belongs in a protected `release` environment so a tag
# pushed by mistake cannot publish without a reviewer.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and package, but do not upload"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The tag is only as good as the commit under it, so the release repeats
      # the two gates whose failure would be worst to publish: the suite with
      # every feature, and the clippy run that fails on a warning.
      - name: cargo test
        run: cargo test --workspace --features pairing-code,storage-file --locked
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: tag matches the workspace version
        # A manual run has no tag: `github.ref_name` is the branch. The check is
        # for the push path, which is the only one that publishes a version.
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            exit 1
          fi

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-26.04
    # A protected environment puts a human between a pushed tag and a public
    # crate. Create it in Settings → Environments and add the secret there.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: resolve the version
        id: version
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: publish syncspin-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if curl -fsS -A "syncspin-release" "https://crates.io/api/v1/crates/syncspin-core/${version}" > /dev/null; then
            echo "syncspin-core ${version} is already published; skipping"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo package -p syncspin-core --locked
          else
            cargo publish -p syncspin-core --locked
          fi

      - name: wait for the index to list syncspin-core
        # `cargo publish` for the client and the server resolves core from the
        # registry, so a version that exists but is not yet in the index would
        # fail the next step with a confusing error.
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          for attempt in $(seq 1 60); do
            if curl -fsS -A "syncspin-release" "https://crates.io/api/v1/crates/syncspin-core/${version}" > /dev/null; then
              echo "syncspin-core ${version} is in the index"
              exit 0
            fi
            sleep 10
          done
          echo "syncspin-core ${version} did not appear in the index within ten minutes" >&2
          exit 1

      - name: publish syncspin-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if curl -fsS -A "syncspin-release" "https://crates.io/api/v1/crates/syncspin-client/${version}" > /dev/null; then
            echo "syncspin-client ${version} is already published; skipping"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo package -p syncspin-client --locked
          else
            cargo publish -p syncspin-client --locked
          fi

      - name: wait for the index to list syncspin-client
        # The server is published after the client, so a client version that
        # exists but has not propagated would fail the next step with a
        # confusing resolution error.
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          for attempt in $(seq 1 60); do
            if curl -fsS -A "syncspin-release" "https://crates.io/api/v1/crates/syncspin-client/${version}" > /dev/null; then
              echo "syncspin-client ${version} is in the index"
              exit 0
            fi
            sleep 10
          done
          echo "syncspin-client ${version} did not appear in the index within ten minutes" >&2
          exit 1

      - name: publish syncspin-server
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if curl -fsS -A "syncspin-release" "https://crates.io/api/v1/crates/syncspin-server/${version}" > /dev/null; then
            echo "syncspin-server ${version} is already published; skipping"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo package -p syncspin-server --locked
          else
            cargo publish -p syncspin-server --locked
          fi

  release:
    name: release
    needs: publish
    # Only a tag has release notes and a version; a manual dispatch on a branch
    # would otherwise try to publish a release named after the branch.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The notes are the changelog section for this version: git-cliff wrote
          # them at release time, so the release page and the file cannot drift.
          version="${TAG#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "${notes//[[:space:]]/}" ]; then
            notes="Release ${version}. See CHANGELOG.md."
          fi
          body=$(printf 'On crates.io: `syncspin-core = "%s"`, `syncspin-client = "%s"` and `syncspin-server = "%s"`.\n\n%s\n' "$version" "$version" "$version" "$notes")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes "$body"
          else
            gh release create "$TAG" --title "$TAG" --notes "$body" --verify-tag
          fi

      - name: mark a dispatch run clearly
        if: github.event_name == 'workflow_dispatch'
        run: echo "This run was started by hand; check the publish step for whether it packaged or uploaded."
