[package]
name = "syncspin-client"
description = "Sendspin client: session loop, noise handshake, Sink trait and event stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
# The roles this build takes part in. The defaults are the roles every client of this crate has
# always had; a build that turns them off drops the code behind them. `player` is the audio side
# (`Sink`, the playout queue, the volume and mute controls); `controller` is the transport and
# seek controls and the group's controller state; `metadata` is the now-playing track. A build with
# none of the three has no role to offer, and the headless entry points refuse to start.
default = ["player", "controller", "metadata"]
player = []
controller = []
metadata = []
# The optional JSON file backend for pairing records. Off by default so a build that does not ask
# for it does no file I/O: records belong to the host, which implements `Storage` itself.
storage-file = []
# Code-based pairing: the static pairing code flow, and the CPace and key-wrapping primitives it
# builds on in `syncspin-core`. Off by default so the default build advertises no method whose
# PAKE it does not carry.
pairing-code = ["syncspin-core/pairing-code", "dep:zeroize"]
# The server-initiated connection mode: advertise `_sendspin._tcp` through a host's `Discovery` and
# accept the servers that connect. Off by default, so a build that does not ask for it opens no
# listening socket and dials a server as before. The mDNS backend is the host's.
discovery = []
# The mDNS backend for `Discovery`: publish `_sendspin._tcp` and browse `_sendspin-server._tcp`.
# Off by default so a build that does not use discovery carries no multicast stack. It joins a
# multicast group and opens sockets; nothing else in this crate does.
mdns = ["dep:mdns-sd"]

[dependencies]
syncspin-core = { version = "0.5.0", path = "../syncspin-core" }
anyhow.workspace = true
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
# mDNS is a synchronous daemon on a thread of its own; the feature is off unless a host asks for
# the backend. Default features off: the `async` and `logging` halves are not used here.
mdns-sd = { version = "0.22", optional = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
# Scrub of the round's scalar, shared point, ISK and `K_wrap`, which exist only inside one
# `accept_server_share` call. Off in a default build, which has no CPace round to scrub.
zeroize = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
snow.workspace = true
# `test-util` is for the paused clock: the keepalive suite runs the shipped 15 s and 10 s windows
# without waiting for them. It is a test-only feature, so the library build carries neither.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }

[package.metadata.docs.rs]
all-features = true
