[package]
name = "syncspin-core"
description = "Sendspin protocol core: Noise handshake, framing, messages and the clock filter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
# Code-based Sendspin pairing: CPace over X25519 with SHA-512. Off by default so the
# default build stays free of the PAKE and its dependencies.
pairing-code = ["dep:elligator2"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
elligator2 = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
snow.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets"] }

[dev-dependencies]
proptest = "~1.11.0"
