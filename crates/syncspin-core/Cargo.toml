[package]
name = "syncspin-core"
description = "Sendspin protocol core: Noise handshake, framing, messages and the clock filter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
# Code-based Sendspin pairing: CPace over X25519 with SHA-512, and the AEAD that seals the
# values crossing the wire under its output. Off by default so the default build stays free
# of the PAKE and its extra dependencies. The AEADs themselves come from `snow`'s resolver,
# which is already a dependency, so no cipher crate is named here.
pairing-code = ["dep:elligator2", "dep:hmac", "dep:subtle", "dep:zeroize"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
# The version pin lives in the workspace table: `=0.1.0`, because a `0.1.x` may change the
# representative convention the generator depends on.
elligator2 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
snow.workspace = true
subtle = { workspace = true, optional = true }
x25519-dalek = { workspace = true, features = ["static_secrets"] }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
proptest = "~1.11.0"

[package.metadata.docs.rs]
all-features = true
