[package]
name = "syncspin-server"
description = "Sendspin server: listener, one group, roles, streaming and pairing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
# The static and dynamic pairing code flows. Off by default, exactly as in `syncspin-client`: a
# build that does not carry CPace must not advertise a method that needs it.
pairing-code = ["syncspin-core/pairing-code"]
# The mDNS backend for `Discovery`: publish `_sendspin-server._tcp` and browse `_sendspin._tcp`.
# Off by default so a build that only listens carries no multicast stack. It joins a multicast
# group and opens sockets; nothing else in this crate does.
mdns = ["dep:mdns-sd"]

[dependencies]
syncspin-core = { version = "0.2.0", path = "../syncspin-core" }
anyhow.workspace = true
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
# mDNS is a synchronous daemon on a thread of its own; the feature is off unless a host asks for
# the backend. Default features off: the `async` and `logging` halves are not used here.
mdns-sd = { version = "0.21", optional = true, default-features = false }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
# Scrub of key material that passes through this crate: the long-term PSK every flow delivers, and
# inside a code round the scalar, shared point, ISK and `K_wrap`. Already in the tree through
# `x25519-dalek`; not optional because the Pairing PSK flow needs it in a default build too.
zeroize.workspace = true

[dev-dependencies]
# The round-trip test in `tests/roundtrip.rs` runs the real client crate against this server. A
# dev-dependency does not change the client's public behaviour or the server's published surface.
# `discovery` is on only for the server-initiated test, which lets a real client advertise.
syncspin-client = { version = "0.2.0", path = "../syncspin-client", features = ["discovery"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[package.metadata.docs.rs]
all-features = true
