# Local gates, run before every commit. Install with `pre-commit install` and
# run everything with `pre-commit run --all-files`. CI runs the same checks
# (`.github/workflows/ci.yml`); this file is the fast copy, not a second source
# of truth.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        files: \.(rs|toml)$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        files: \.(rs|toml)$
        pass_filenames: false

      # Shell scripts are linted with the system `shellcheck`; CI installs it in the `lint` job.
      # The pattern also covers extension-less hook scripts under `.githooks/`.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.sh$|^\.githooks/

      # Prettier is not vendored: the version is pinned here so formatting
      # cannot drift between machines. Markdown is included because `docs/`,
      # `AGENTS.md` and `README.md` are kept prettier-clean; the hook checks
      # only the files a commit touches.
      - id: prettier
        name: prettier
        entry: npx --yes prettier@3.9.10 --check
        language: system
        files: \.(md|ya?ml|json|json5)$

# `cargo deny check` is deliberately not a hook: it needs `cargo-deny` and the
# advisory database over the network, and would block a commit on a machine
# without them. The `deny` job in CI is the gate.
