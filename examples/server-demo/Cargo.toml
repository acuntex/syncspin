[package]
name = "server-demo"
description = "Example Sendspin server that approves one client and streams a tone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# Mirrors the server's mDNS backend, so `--mdns` can publish `_sendspin-server._tcp` and dial the
# clients that advertise `_sendspin._tcp`. Off by default, exactly as in the crate.
mdns = ["syncspin-server/mdns"]

[dependencies]
syncspin-server = { version = "0.4.0", path = "../../crates/syncspin-server" }
anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
