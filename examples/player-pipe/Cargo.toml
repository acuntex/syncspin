[package]
name = "player-pipe"
description = "Example Sendspin player that streams PCM to standard output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# The example pairs out of the box: it keeps its pairing PSK and records in one JSON file through
# the client's optional file backend. The library itself still does no file I/O by default.
default = ["storage-file"]
storage-file = ["syncspin-client/storage-file"]
# Mirrors the client's code-pairing feature, so a workspace `--all-features` build sees the
# configuration fields that only exist there. A host crate that enables `pairing-code` on the
# client needs the same mirror to construct `ClientConfig`.
pairing-code = ["syncspin-client/pairing-code"]
# The client's server-initiated mode plus its mDNS backend, so `--advertise` publishes
# `_sendspin._tcp` and `--discover` browses `_sendspin-server._tcp` over a real multicast group.
# The backend is the crates'; the example opens no socket of its own.
discovery = ["syncspin-client/discovery", "syncspin-client/mdns"]

[dependencies]
syncspin-client = { version = "0.3.1", path = "../../crates/syncspin-client" }
# The example builds its own version-0 pairing token, which the client has no accessor for yet:
# the encoder is the pairing token module, so the example depends on the protocol crate directly.
syncspin-core = { version = "0.3.1", path = "../../crates/syncspin-core" }
anyhow.workspace = true
getrandom.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
