[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["syncspin contributors"]
repository = "https://github.com/acuntex/syncspin"
readme = "README.md"
keywords = ["sendspin", "music-assistant", "audio", "streaming"]
categories = ["multimedia::audio", "network-programming"]

# Pinned versions are shared by every crate; a crate opts in with `dep.workspace = true`.
[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
# Only the Elligator 2 map is needed for CPace; the default `keygen` feature would add
# curve25519-dalek, rand_core and zeroize for a key generator this workspace does not use.
# Pinned exactly: a `0.1.x` may move the representative convention (which field elements count as
# representatives, which bit selects the map's branch), and a negated input would then map to the
# other point without failing a vector, because that point is still a valid group element.
elligator2 = { version = "=0.1.0", default-features = false }
# CPace's explicit key confirmation is HMAC-SHA-512 (§10.4 of the draft). The construction is
# standard, so it comes from the RustCrypto crate rather than being written here.
# Held at 0.12: hmac 0.13 requires digest 0.11, which sha2 0.11 pulls in, and
# that wave declares Rust 1.88 against this workspace's MSRV of 1.85.
hmac = { version = "0.12.1", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
# Held at 0.10 for the same reason as `hmac` above; see `renovate.json5`.
sha2 = "0.10.9"
# `std` is off on purpose: snow 0.10's `std` feature turns on its optional `ring` dependency,
# which `deny.toml` bans for the ARMv7 build. The two features below are otherwise its defaults.
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "default-resolver-crypto"] }
x25519-dalek = "3.0.0"
tokio = "1.54.1"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
# Draws the pairing PSK and each pairing's long-term PSK from the operating system's CSPRNG. Already
# in the tree, and small enough that the client can depend on it directly rather than on `rand`.
getrandom = "0.4.0"
# Both are already in the tree through `x25519-dalek` and `snow`. The CPace layer names them
# directly because it relies on their contracts - scrub on drop, compare without an early exit -
# and a transitive dependency it does not declare is one it cannot rely on.
zeroize = "1.9.1"
subtle = { version = "2.6.1", default-features = false }
