[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["syncspin contributors"]

# Pinned versions are shared by every crate; a crate opts in with `dep.workspace = true`.
[workspace.dependencies]
anyhow = "1.0.104"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.10.9"
snow = "0.9.6"
x25519-dalek = "2.0.1"
tokio = "1.54.1"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
